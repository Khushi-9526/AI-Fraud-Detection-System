<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analyze Transaction</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav>

        <div class="logo">
            AI Fraud Detection
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Analyze
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h1>
            Analyze Transaction
        </h1>

        <p class="subtitle">
            Enter transaction details to calculate
            the fraud risk.
        </p>


        <form action="analyze"
              method="post">


            <label>
                Transaction Amount
            </label>

            <input
                type="number"
                name="amount"
                step="0.01"
                placeholder="Enter amount"
                required
            >


            <label>
                Location
            </label>

            <input
                type="text"
                name="location"
                placeholder="Example: Delhi"
                required
            >


            <label>
                Transaction Type
            </label>

            <select name="transactionType">

                <option value="Online">
                    Online
                </option>

                <option value="Offline">
                    Offline
                </option>

            </select>


            <label>
                International Transaction
            </label>

            <select name="international">

                <option value="no">
                    No
                </option>

                <option value="yes">
                    Yes
                </option>

            </select>


            <label>
                Device
            </label>

            <select name="device">

                <option value="Mobile">
                    Mobile
                </option>

                <option value="Laptop">
                    Laptop
                </option>

                <option value="Unknown">
                    Unknown
                </option>

            </select>


            <button type="submit">

                🔍 Detect Fraud

            </button>

        </form>

    </div>

</body>

</html>
